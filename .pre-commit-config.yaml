# 팀 하네스 PC 커밋 훅. 설치: pip install pre-commit → 저장소에서 pre-commit install (한 번)
# 커밋 직전에 비밀값을 찾고, main에 바로 커밋하는 것을 막는다. --no-verify로 건너뛰어도 CI가 다시 검사한다.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
